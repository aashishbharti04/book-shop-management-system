# Local MySQL for production-parity development.
#
#   docker-compose up -d
#   export DATABASE_URL="mysql+pymysql://bookshop:bookshop@localhost:3306/book_shop"
#   alembic upgrade head
#
# Adminer (a lightweight DB UI) is available at http://localhost:8080
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: book_shop
      MYSQL_USER: bookshop
      MYSQL_PASSWORD: bookshop
    ports:
      - "3306:3306"
    volumes:
      - bookshop_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  bookshop_mysql_data:
