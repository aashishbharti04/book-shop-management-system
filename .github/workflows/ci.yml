name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- Linting
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  # ------------------------------------------------------------ Type-checking
  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy

  # ------------------------------------------------------------------ Testing
  test:
    name: Test (Python ${{ matrix.python-version }}, SQLite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system libraries for offscreen Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: pip install -e ".[dev]"
      - name: pytest (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

  # ------------------------------------------------------ MySQL parity (prod DB)
  mysql-parity:
    name: Migrations against MySQL 8
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: book_shop
          MYSQL_USER: bookshop
          MYSQL_PASSWORD: bookshop
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: alembic upgrade head (MySQL)
        env:
          DATABASE_URL: mysql+pymysql://bookshop:bookshop@127.0.0.1:3306/book_shop
        run: alembic upgrade head

  # ------------------------------------------------------- Build verification
  build:
    name: Build distribution (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify metadata with twine
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  # -------------------------------------------------- Deployment-ready checks
  deploy-ready:
    name: Deployment-ready checks
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, mysql-parity]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install the built wheel into a clean environment
        run: pip install dist/*.whl
      - name: Smoke test the installed console script
        run: |
          bookshop --version
          bookshop initdb
      - name: All gates passed
        run: echo "✅ Lint, types, tests, MySQL parity, build, and install smoke all passed."
