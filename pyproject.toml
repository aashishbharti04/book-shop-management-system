[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookshop"
version = "0.1.0"
description = "A modern, production-ready desktop Book Shop Management System built with PySide6."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "aashishbharti04", email = "aashish@marketdoctorsonline.com" }]
keywords = [
  "bookshop",
  "inventory",
  "point-of-sale",
  "pyside6",
  "qt",
  "sqlalchemy",
  "desktop",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = [
  "PySide6>=6.6",
  # Pinned to the 1.4 series the models are written against (classic `Column`
  # style). The app runs on 2.0 too, but a clean `Mapped[]` migration is needed
  # before relaxing this — tracked for a future release.
  "SQLAlchemy>=1.4,<2.0",
  "alembic>=1.11",
  "bcrypt>=4.0",
  "matplotlib>=3.7",
  "python-dotenv>=1.0",
  "PyMySQL>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-qt>=4.2",
  "ruff>=0.1",
  "mypy>=1.5",
]

[project.scripts]
bookshop = "bookshop.__main__:main"

[project.urls]
Homepage = "https://github.com/aashishbharti04/book-shop-management-system"
Repository = "https://github.com/aashishbharti04/book-shop-management-system"
Issues = "https://github.com/aashishbharti04/book-shop-management-system/issues"
Changelog = "https://github.com/aashishbharti04/book-shop-management-system/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bookshop = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "gui: marks tests that construct Qt widgets (run with QT_QPA_PLATFORM=offscreen)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"
extend-exclude = ["legacy", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["bookshop"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["bookshop"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
